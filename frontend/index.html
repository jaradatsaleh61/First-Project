<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Expense Tracker</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- NAVBAR -->

  <nav class="navbar bg-dark navbar-dark">

    <div class="container">

      <a class="navbar-brand" href="#">
        Expense Tracker
      </a>

    </div>

  </nav>


  <main class="container">

    <div id="errorAlert" class="alert alert-danger d-none">

    </div>
    <!-- SUMMARY CARDS -->

    <div class="row summary-cards">
      <div class="col-md-4">

        <div class="card">

          <div class="card-body">

            <h5 class="card-title">
              Total Amount
            </h5>

            <p class="card-text" id="totalAmount">
              0
            </p>

          </div>

        </div>

      </div>


      <div class="col-md-4">

        <div class="card">

          <div class="card-body">

            <h5 class="card-title">
              Number of Expenses
            </h5>

            <p class="card-text" id="expenseCount">
              0
            </p>

          </div>

        </div>

      </div>


      <div class="col-md-4">

        <div class="card">

          <div class="card-body">

            <h5 class="card-title">
              Highest Expense
            </h5>

            <p class="card-text" id="highestExpense">
              0
            </p>

          </div>

        </div>

      </div>

    </div>


    <!-- ADD EXPENSE -->

    <section class="mt-4">

      <h2>Add Expenses</h2>

      <form id="expenseForm">


        <div class="mb-3">

          <label for="title" class="form-label">
            Title
          </label>

          <input type="text" id="title" class="form-control" required>


          <label for="amount" class="form-label">
            Amount
          </label>

          <input type="number" id="amount" class="form-control" required>

        </div>


        <div class="mb-3">

          <label for="category" class="form-label">
            Category
          </label>

          <select id="category" class="form-select" required>

            <option value="Food">
              Food
            </option>

            <option value="Transport">
              Transport
            </option>

            <option value="Bills">
              Bills
            </option>

            <option value="Entertainment">
              Entertainment
            </option>

            <option value="Other">
              Other
            </option>

          </select>

        </div>


        <div class="mb-3">

          <label for="date" class="form-label">
            Date
          </label>

          <input type="date" id="date" class="form-control" required>

        </div>


        <div id="formError" class="alert alert-danger d-none">
        </div>


        <!-- IMPORTANT: This belongs to expenseForm -->

        <button type="submit" class="btn btn-primary">
          Add Expense
        </button>

      </form>

    </section>


    <!-- EXPENSES -->

    <section class="mt-4">

      <h2>Expenses</h2>


      <!-- CATEGORY FILTER -->

      <div class="mb-3">

        <label for="categoryFilter" class="form-label">
          Filter by Category
        </label>


        <select id="categoryFilter" class="form-select">

          <option value="All">
            All
          </option>

          <option value="Food">
            Food
          </option>

          <option value="Transport">
            Transport
          </option>

          <option value="Bills">
            Bills
          </option>

          <option value="Entertainment">
            Entertainment
          </option>

          <option value="Other">
            Other
          </option>

        </select>

      </div>


      <!-- EXPENSE TABLE -->

      <table class="table">

        <thead>

          <tr>

            <th>
              Title
            </th>

            <th>
              Amount
            </th>

            <th>
              Category
            </th>

            <th>
              Date
            </th>

            <th>
              Actions
            </th>

          </tr>

        </thead>


        <tbody id="expenseTableBody">

        </tbody>

      </table>

    </section>

  </main>


  <!-- EDIT MODAL -->

  <div class="modal" id="editModal">

    <div class="modal-dialog">

      <div class="modal-content">


        <!-- MODAL HEADER -->

        <div class="modal-header">

          <h5 class="modal-title">
            Edit Expense
          </h5>

        </div>


        <!-- MODAL BODY -->

        <div class="modal-body">

          <form id="editForm">


            <!-- EDIT TITLE -->

            <div class="mb-3">

              <label for="editTitle" class="form-label">
                Title
              </label>

              <input type="text" id="editTitle" class="form-control" required>

            </div>


            <!-- EDIT AMOUNT -->

            <div class="mb-3">

              <label for="editAmount" class="form-label">
                Amount
              </label>

              <input type="number" id="editAmount" class="form-control" required>

            </div>


            <!-- EDIT CATEGORY -->

            <div class="mb-3">

              <label for="editCategory" class="form-label">
                Category
              </label>

              <select id="editCategory" class="form-select" required>

                <option value="Food">
                  Food
                </option>

                <option value="Transport">
                  Transport
                </option>

                <option value="Bills">
                  Bills
                </option>

                <option value="Entertainment">
                  Entertainment
                </option>

                <option value="Other">
                  Other
                </option>

              </select>

              <div id="loadingSpinner" class="text-center d-none">
                <div class="spinner-border" role="status">
                  <span class="visually-hidden">Loading...</span>
                </div>
              </div>

            </div>


            <!-- EDIT DATE -->

            <div class="mb-3">

              <label for="editDate" class="form-label">
                Date
              </label>

              <input type="date" id="editDate" class="form-control" required>

            </div>


          </form>

        </div>


        <!-- MODAL FOOTER -->

        <div class="modal-footer">

          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
            Cancel
          </button>


          <!-- IMPORTANT:
               This button submits editForm -->

          <button type="submit" form="editForm" class="btn btn-primary">
            Save Changes
          </button>

        </div>

      </div>

    </div>

  </div>


  <!-- BOOTSTRAP -->

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <!-- OUR JAVASCRIPT -->

  <script src="js/app.js"></script>

</body>

</html>
